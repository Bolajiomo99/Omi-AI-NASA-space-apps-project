
{% extends "base.html" %}

{% block title %}AI Assistant | Omi AI{% endblock %}

{% block content %}

<h1>Ask Omi AI</h1>

<p>
    Ask questions about environmental datasets and analysis results.
</p>

<section class="panel">

    <div id="chat-output" aria-live="polite"></div>

    <form id="chat-form">

        <input
            type="text"
            id="question"
            placeholder="Ask about a temperature or rainfall trend..."
            required
        >

        <button type="submit" class="button">
            Send
        </button>

    </form>

</section>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/assistant.js') }}"></script>
{% endblock %}
